<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Happy Birthday from SMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f6f1e7; --ink: #0f4a4f; --gold: #b8860b; --muted: #5b5b5b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #10272a; --ink: #f3e3a6; --gold: #e0b94a; --muted: #c9d3d3; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: "Lora", Georgia, serif; display: flex; justify-content: center;
    padding: 28px 16px;
  }
  main { width: 100%; max-width: 760px; text-align: center; }
  .greeting { font-family: "Great Vibes", cursive; font-size: clamp(2.2rem, 8vw, 3.8rem); line-height: 1.15; margin: 8px 0 22px; }
  .name { color: var(--gold); display: block; overflow-wrap: anywhere; }
  .card { width: 100%; height: auto; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.28); display: block; }
  footer { margin-top: 22px; color: var(--muted); font-size: .95rem; }
</style>
</head>
<body>
<main>
  <h1 class="greeting" id="greeting">Happy Birthday!</h1>
  <img class="card" id="card" src="cards/card_a.jpg" alt="Birthday card from the Singapore Malayalee Association">
  <footer>With warm wishes from everyone at the Singapore Malayalee Association</footer>
</main>
<script>
  // ?name=Constance&card=b  -- the daily script picks the card; a missing or unknown card shows card a.
  const params = new URLSearchParams(location.search);
  const name = (params.get("name") || "").trim().slice(0, 40);
  if (name) {
    const greeting = document.getElementById("greeting");
    const nameEl = document.createElement("span");
    nameEl.className = "name";
    nameEl.textContent = name + "!";
    greeting.textContent = "Happy Birthday, ";
    greeting.append(nameEl);
    document.title = "Happy Birthday, " + name + "!";
  }
  const card = (params.get("card") || "").toLowerCase();
  if (/^[a-z]$/.test(card)) {
    const img = document.getElementById("card");
    img.onerror = () => { img.onerror = null; img.src = "cards/card_a.jpg"; };
    img.src = "cards/card_" + card + ".jpg";
  }
</script>
</body>
</html>
